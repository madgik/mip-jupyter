name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install root package and dev deps
        run: uv sync --extra dev
      - name: Codex and MCP tests
        run: |
          uv run pytest \
            mip_jupyter_dev/test_codex_bootstrap.py \
            mip_jupyter_dev/test_jupyter_mcp_cli.py \
            mip_jupyter_dev/test_shell_guard.py \
            mip_jupyter_dev/test_stroke_federated.py \
            python-client/tests/test_jupyter_mcp_tools.py \
            -q
      - name: Client unit tests
        run: uv run python -m unittest discover -s python-client/tests -p "test_*.py"
      - name: Smoke script
        run: uv run python python-client/verify_script.py
      - name: Whitespace check
        run: git diff --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Layer cache in GitHub Actions: only changed layers rebuild (deps layer until uv.lock changes).
      - name: Build notebook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/singleuser/Dockerfile
          platforms: linux/amd64
          tags: mip-jupyter:ci
          load: true
          cache-from: type=gha,scope=singleuser
          cache-to: type=gha,scope=singleuser,mode=max
      - name: Build hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hub/Dockerfile
          platforms: linux/amd64
          tags: mip-jupyterhub:ci
          load: true
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max
      - name: Single-user image smoke
        run: scripts/smoke-singleuser-image.sh mip-jupyter:ci
